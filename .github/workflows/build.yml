name: Build Proud Rani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Found: $ZIP"
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Find Android project
        run: |
          SETTINGS=$(find source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found!"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProudRani-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
